// The GI sample rate at 1/2: the bounce ray fires on a frame-rotating
// 1-in-N subset of pixels and the history fills the rest. Rate 1 (the default,
// and what every tier sets) is the full-rate bounce; 2 and 4 trade rays for a
// slower temporal response and recover about half and three quarters of the
// bounce's cost. Judge in motion: walk the e1m3 start corridor and an e1m7
// lava room, turn the camera sharply, strafe past pillars. What to look for:
// bounce light lagging onto walls on a turn, and brief dark speckle at freshly
// exposed silhouettes. gi_rate1.cfg restores full rate.
rt_metal_gi 1
rt_metal_gi_rate 2
echo GI RATE 1/2 (gi_rate1.cfg restores full rate)

// rt_metal_jitter OFF: the ray tracer's rays go through each texel's centre
// every frame -- the light holds still while the temporal upscaler's jitter
// moves the stone under it. The default is on; compare with exec rtjitter_on.cfg.
rt_metal_jitter 0
reellabel "^3rt_metal_jitter 0" "the traced light holds still under the jitter"

// M5 flamethrower SOUNDS on (2026-10-05; the default since 0.1.4): the trigger strikes the spark and the
// gas catches with a whoosh, the roar coming in under it; letting go, the valve
// shuts and the flame gutters out. m5_flamer_sfx scales both (1 as designed).
// exec flamer_sfx_off.cfg for the rocket's whoosh as before.
m5_flamer_sfx 1
echo flamethrower: ignition and wind-down sounds ON (exec flamer_sfx_off.cfg for the old whoosh)

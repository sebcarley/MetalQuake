// Sky lightning: on a map with open sky, a cold flash from the sky every so
// often, the fog under it lighting with it at half strength, and thunder a
// few seconds after. On by default; this file sets the flashes to a mean of
// 40 s rather than the engine's own 60 so the storm shows sooner. Needs the
// ray tracer's wall lighting. r_skylightning_period is the mean interval,
// r_skylightning_fog how much of the flash reaches the air
// (skylightning_fog1.cfg is all of it, skylightning_nofog.cfg none).
r_skylightning 1
r_skylightning_period 40
r_skylightning_fog 0.5
echo "sky lightning ON -- a cold flash from the open sky about every 40 s (the engine's own mean is 60), the fog under it lighting with it, thunder after (exec skylightning_off.cfg to revert; r_skylightning_period is the mean interval, r_skylightning_fog how much of the flash reaches the air)"

// M5 weapon feel OFF: the 1996 guns exactly -- no kick, the stock grenade
// bounce, no nail tracers, nails from the centre line, no axe sparks. The
// kick, the tracers, the barrel streams and the axe sparks are on by default;
// exec feel_on.cfg puts them back. All five are rows on Options -> M5 Fun Mods.
m5_kick 0
m5_grenadebounce 0
m5_nailtracer 0
m5_nailbarrels 0
m5_axesparks 0
echo weapon feel OFF -- the 1996 guns (exec feel_on.cfg restores the shipped set)

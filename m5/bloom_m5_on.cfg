// The modern bloom (the shipped look): a soft threshold on the float scene
// buffer and a five-level chain in place of the original blur. r_bloom stays
// the master switch; r_bloom_m5_threshold / _knee / _intensity / _levels shape
// the glow. exec bloom_m5_off.cfg is the original blur.
r_bloom 1
r_bloom_m5 1
echo "modern bloom ON -- soft threshold on the float scene buffer, a five-level chain (r_bloom_m5_threshold / _knee / _intensity / _levels; exec bloom_m5_off.cfg for the original blur)"

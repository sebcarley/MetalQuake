// The shipped fog lighting (since 2026-09-28): only the brightest light at
// each fog step is shadow-tested and the rest fill in unshadowed
// (rt_metal_fog_residual), with the god rays at 0.5 -- no fizz in motion, a
// fifth faster, and a torch behind a pillar warms the fog through it. Every
// quality tier sets this. exec foglight_on.cfg shadows every light instead.
rt_metal_lightsample 0
rt_metal_fog_beams 0.5
echo "foglight OFF: the shipped fog -- the brightest light shadowed, the rest a fill (exec foglight_on.cfg shadows every light)"

// Fog lighting the older way: only the brightest light at each fog step is
// shadow-tested and the rest fill in unshadowed, with the god-ray term at 0.1.
// The shipped picture shadows every light in the fog (rt_metal_lightsample 1,
// on every quality tier from Fast up) with the god rays at 0.5:
// exec foglight_beams5.cfg restores it, and so does a tier click.
rt_metal_lightsample 0
rt_metal_fog_beams 0.1
echo "foglight OFF: the brightest light only, beams 0.1 (exec foglight_beams5.cfg restores the shipped look)"

// rt_metal_jitter ON: the ray tracer's rays follow the temporal upscaler's
// sub-pixel jitter, so the traced light moves with the picture it lights. Only
// on the tiers that use the temporal mode (Better, Best, Ultimate) and only
// with same-frame RT (the default); the engine log says "RT jitter armed" when
// it is live, and the first switch-on stalls briefly while its trace kernel is
// built. Look at the edges of light and shadow where they meet sky or a dark
// recess -- a lit beam against the sky, an arch soffit, a shadow line across
// the floor -- while moving and while standing still. They should stair-step
// less; watch for any new shimmer on far floors. On by default; compare with
// exec rtjitter_off.cfg, which holds the rays still.
rt_metal_jitter 1
reellabel "^3rt_metal_jitter 1" "the traced light follows the temporal jitter"

// Torch embers (the default): about three a second lift off every torch,
// brazier and candle in view, drift, cool from orange to a dull red and go out
// within a second or two. m5_torch_embers is the rate; 2-4 is the sensible
// range. exec embers_off.cfg switches them off.
m5_torch_embers 3
echo "torch embers ON (the default) -- three a second off every torch in view (exec embers_off.cfg switches them off; m5_torch_embers is the rate)"

// Same-frame RT pipelining: the frame's ordinary drawing is committed to the
// GPU the moment the ray trace is, so the two run side by side instead of one
// after the other. Measured: they do overlap, and the frame comes out the same
// length, because the GPU is already fully busy and the work is only
// reordered. Off by default; kept for comparison. Metal only.
rt_metal_pipeline 1
echo "RT pipelining ON (exec pipeline_off.cfg to revert; measured to change the frame rate by nothing)"

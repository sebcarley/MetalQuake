// SURFACE MIST ladder. r_volumetric_mistheight is the scale height, in world
// units, of the band of mist that lies on every liquid surface;
// r_volumetric_watermist is its strength. A low value is a skin only the shore
// ever sees -- a ray across the lake never meets it while rays grazing the bank
// run inside it; a tall band tends toward a haze wall. The ladder is mist_low
// 12 / mist_mid 26 (the default) / mist_high 40.
// This rung: a low skin.
r_volumetric_mistheight 12
echo "surface mist height 12 (mist_low; the ladder is mist_low 12 / mist_mid 26 / mist_high 40; r_volumetric_watermist is the strength)"

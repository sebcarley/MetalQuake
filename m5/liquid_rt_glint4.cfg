// The rippled reflection (see liquid_rt_ripple.cfg) with the reflection FOUR
// times brighter: the video's water reflects strongly because its water is dark
// and its torches bright, and Fresnel at a moat seen from above makes the
// physical glint faint. exec liquid_rt_off.cfg reverts.
rt_metal_liquids_rt 1
rt_metal_liquids_reflect 4
rt_metal_liquids_ripple 1
r_watersurface 1
reellabel "^3rippled reflection, x4 (ripple 1, reflect 4)" "the room in the water, brightened four times"
echo "liquid pair ON, reflection rippled and brightened x4 (exec liquid_rt_off.cfg to revert)"

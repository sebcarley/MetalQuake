// The scorch glow (the default): where a ball lightning earths or a grounding
// arc lands, and where an axe blow strikes stone, the mark glows orange and
// cools to nothing over about three seconds. exec scorchglow_off.cfg switches
// it off.
cl_particles_scorchglow 1
echo "scorch glow ON (the default) -- the ball's and the axe's marks glow orange and cool (exec scorchglow_off.cfg switches it off)"

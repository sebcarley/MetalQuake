// Contact-hardened shadows (the default): a shadow sharpens where its caster
// meets the surface and softens as the caster lifts away. rt_metal_contact
// blends the effect (1 full, 0 off). exec contact_off.cfg switches it off.
rt_metal_contact 1
echo "contact-hardened shadows ON (the default) -- shadows sharpen where the caster meets the surface (exec contact_off.cfg switches it off; rt_metal_contact blends)"

// The ash dust, dimmer still -- the rung below dust_ash.cfg if the motes are
// still catching the eye in an ordinary torchlit corridor. The room's light on
// them drops to a fifth (0.2) and their opacity to 0.4; the flashes are still
// untouched. Back to the shipped defaults: cl_particles_lighting_static 1 and
// m5_dust_alpha 0.5.
m5_dust_tint 1
cl_particles_lighting_static 0.2
m5_dust_alpha 0.4
m5_reellabel_time 600
reellabel "DUST: ASH, DARKER" "room light at 0.2, alpha 0.4"
echo "DUST ASH DARK: room light at 0.2. exec dust_ash.cfg is the middle rung."

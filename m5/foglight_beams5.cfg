// Every light shadowed in the fog, with the god-ray term at its shipped 0.5 --
// the same as foglight_on.cfg, kept under this name so older notes still
// work. The shipped fog shadows the brightest light only (exec
// foglight_off.cfg); foglight_beams3.cfg is the softer-beam rung.
rt_metal_lightsample 1
rt_metal_fog_beams 0.5
echo "foglight ON, beams 0.5 (the same as foglight_on.cfg; exec foglight_off.cfg for the shipped fog)"

// THE FOG FIZZ, REMEDY B: the pick's alternating hybrid (mode 2) in place of the
// single-pass one (3). Measured on demofizz f3000-3007: 1.65 -> 1.22 levels at the
// crosshair's fog; the torch shadows in the fog stay. Costs a few per cent.
rt_metal_lightsample 1
rt_metal_lightsample_hybrid 2
rt_metal_fog_stride 4
reellabel "^3fog pick hybrid 2" "a quarter of the fizz off, the shadows kept"
echo "fog light pick: hybrid 2 (exec fizz_back.cfg to restore)"

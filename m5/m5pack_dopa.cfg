// Dimension of the Past -- per-pack look
// See m5pack_hipnotic.cfg for what may go in these files and why.
//
// This is the pack the automatic correction gets wrong, and the reason these
// files exist. Its light budget of 61 asks for a 2.4x lift, but its albedo and
// fullbright coverage are already well above id1's, so the light statistic
// mispredicts it -- with the correction on it overshoots to 1.47 of stock
// Quake, and with it off it sits at a perfectly reasonable 1.16.

m5_packlight 0          // the light statistic mispredicts this pack; leave it
m5_packbrightness 0.95

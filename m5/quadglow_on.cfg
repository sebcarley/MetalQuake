// The powerup glow (the default): a blue (Quad) or red (Pentagram) light at
// radius 400 in place of the stock fixed white light at 200, so the aura falls
// away gradually and nothing clips. m5_powerupglow is the strength (1),
// m5_powerupglow_radius the reach. quadglow_soft.cfg is half strength at 550;
// quadglow_off.cfg the stock white.
m5_powerupglow 1
m5_powerupglow_radius 400
echo "powerup glow: blue quad, red pentagram (the default; quadglow_off.cfg is the stock white)"

// THE FOG FIZZ, REMEDY C: a shadow cast every 2nd fog step instead of every 4th.
// Measured on demofizz f3000-3007: 1.65 -> 1.34 levels at the crosshair's fog;
// the torch shadows in the fog stay. Costs about a tenth of the frame.
rt_metal_lightsample 1
rt_metal_lightsample_hybrid 3
rt_metal_fog_stride 2
reellabel "^3fog casts every 2nd step" "a fifth of the fizz off, the shadows kept"
echo "fog light pick: stride 2 (exec fizz_back.cfg to restore)"

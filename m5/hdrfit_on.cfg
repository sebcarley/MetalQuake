// r_hdr_displayfit ON: the gamma curve's ceiling takes the HDR grant in the
// picture's own encoding (a display granting 1.756 in linear light gives 1.279
// once encoded), and r_hdr_shoulder's roll-off aims at what the display can
// actually show after the curve -- full white without HDR. Look at the
// brightest things on screen: a muzzle flash, lava, a lit wall at a torch.
// With HDR on they should keep shading at the very top instead of flat
// patches; without HDR they should reach full white. If the highlights just
// above the knee read dim, try r_hdr_shoulder 0.85 or 0.9. Off by default;
// compare with exec hdrfit_off.cfg.
r_hdr_displayfit 1
reellabel "^3r_hdr_displayfit 1" "the brightest light ends at what the display can show"

// The shotgun's muzzle sparks back to the shipped spray: all seven
// m5_muzzleflash_sparks knobs at 1, their defaults. m5_muzzleflash_sparks is
// the count, _speed how fast they fly, _spread how wide they fan, _length and
// _thickness the streak, _life how long they last, _brightness how bright they
// start. The spray needs m5_shotgun on.
m5_muzzleflash_sparks 1
m5_muzzleflash_sparks_speed 1
m5_muzzleflash_sparks_spread 1
m5_muzzleflash_sparks_length 1
m5_muzzleflash_sparks_thickness 1
m5_muzzleflash_sparks_life 1
m5_muzzleflash_sparks_brightness 1
echo "muzzle sparks back to the shipped spray (all seven m5_muzzleflash_sparks knobs at 1, the defaults)"

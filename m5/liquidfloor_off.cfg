// The air murk's floor over water, the older way. The murk settles on the
// local floor, and over a pool that floor is the pool BED -- so the murk over a
// lake reads far above its floor and vanishes while it hangs over the bank
// beside it, a hard step along the waterline. The default
// (r_volumetric_liquidfloor 1) makes the liquid surface the air's floor and
// the step goes; r_volumetric_liquidfloor 1 restores it.
r_volumetric_liquidfloor 0
echo "liquid floor OFF -- the air murk vanishes over water, the older murk (r_volumetric_liquidfloor 1 restores the default)"

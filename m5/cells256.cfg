// The particle atlas at 256-pixel cells (the default): every spark, ember,
// puff, flash and droplet drawn sixteen times finer. It regenerates the moment
// it is set; no restart. exec cells64.cfg is Quake's own 64-pixel font.
cl_particles_texsize 256
echo "particle atlas 256-pixel cells ON (the default) -- every spark, ember, puff, flash and droplet sixteen times finer (exec cells64.cfg for Quake's own font)"

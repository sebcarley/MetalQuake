// Arcane Dimensions -- per-pack look
// See m5pack_hipnotic.cfg for what may go in these files and why.
//
// AD is a professionally lit 2020 total conversion, not a 1997 pack: its
// light budgets sit close to the id1 baseline already (start 149 against
// e1m3's 146), and where they differ it is the mapper's deliberate gloom or
// blaze, not a period house style to correct. The auto-normalisation is off
// for the same reason it is off for Dimension of the Past: the statistic
// would fight the design. Its 0-255 _color lights are handled separately by
// m5_lightcolor255, which stays on and reports per map.

m5_packlight 0
m5_packbrightness 1

// The froxel fog volume: the fog is kept in a 3D grid of depth cells and its
// history blended per cell at the cell's own depth, so a strafe does not smear
// it. The default (rt_metal_fog_froxel 1). The quality tiers switch it on at
// Better and above and set the slice count themselves (24 on Better, 32 on
// Best, 48 on Ultimate); Good and below run the flat 2D history. This file sets
// the engine's own 48 slices and history 0.9; a tier click re-pins the tier's
// values. exec froxel_off.cfg is the flat 2D history; froxel24.cfg and
// froxel095.cfg are the cheaper and the deeper arm.
rt_metal_fog_froxel 1
rt_metal_fog_froxel_slices 48
rt_metal_fog_froxel_history 0.9
rt_metal_fog_froxel_curve 0
echo "froxel fog ON: 48 slices, history 0.9 (exec froxel_off.cfg for the flat 2D history; froxel24.cfg / froxel095.cfg are the arms; a tier click re-pins the tier's slices)"

// A hand-set sun for stock Quake's outdoor e1m1 start: high, from the
// south-west, warm. Stock Quake's maps declare no sun of their own, so the
// rt_metal_sun_* overrides supply one; rt_metal_sun_mangle and rt_metal_sun_light
// are the knobs for any other map. It shows only under Full Wall Lighting.
// exec sun_off.cfg reverts.
rt_metal_sun 1
rt_metal_sun_light 200
rt_metal_sun_mangle "300 -60"
rt_metal_sun_color "1 0.95 0.85"
rt_metal_sun_penumbra 2
echo "sky light ON with a hand-set sun (exec sun_off.cfg to revert)"

// Room reverb (the default): a stereo reverb whose room is read from the level
// around the listener -- tighter in a corridor, longer in a hall, nearly
// nothing under open sky. snd_reverb_wet 0.15 is the shipped level;
// snd_reverb_decay scales how long rooms ring. exec reverb_off.cfg switches it
// off.
snd_reverb 1
snd_reverb_wet 0.15
echo "room reverb ON at wet 0.15 (the default; exec reverb_off.cfg switches it off; snd_reverb_wet is the level)"

// Caustics (the default, 0.6): the floors and walls of pools take a moving
// pattern of light cells, the way sunlight through water does. r_caustics is
// the strength, r_caustics_scale sizes the cells and r_caustics_speed paces
// them. exec caustics_off.cfg switches it off.
r_caustics 0.6
echo "caustics ON (the default) -- moving light cells on the floors and walls of pools (exec caustics_off.cfg switches it off; r_caustics is the strength, _scale and _speed the pattern)"

// WATER SURFACE, the FTEQW engine's water style like for like: crystal-clear
// water seen from the bank (no in-water murk from the air) and no shallow
// taper. A comparison arm; exec watersurface_on.cfg restores the shipped look.
exec watersurface_on.cfg
r_watersurface_clear 0
r_watersurface_taper 0
echo "water surface ON, the FTEQW engine's style like for like -- exec watersurface_on.cfg for the shipped look"

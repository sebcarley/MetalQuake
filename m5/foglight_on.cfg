// Every light casts a shadow in the fog: each fog step shadow-tests one light,
// picked in proportion to what it scatters there, so a torch behind a pillar
// shades the fog the way a wall does. OFF on every quality tier since
// 2026-09-28: in motion the pick's variance reads as a fine fizz in the fog
// (worst wading a long fogged channel), and the fog is a fifth faster without
// it. A tier click turns it off again; so does exec foglight_off.cfg. The
// god-ray term stays at its shipped 0.5 (foglight_beams3.cfg tries 0.3).
rt_metal_lightsample 1
rt_metal_fog_beams 0.5
echo "foglight ON: every light shadowed in the fog, with its fizz in motion (exec foglight_off.cfg for the shipped fog)"

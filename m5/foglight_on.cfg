// Every light casts shadows in the fog: each fog step shadow-tests one light,
// picked in proportion to what it scatters there, so a torch behind a pillar
// shades the fog the way a wall does. This arm keeps the god-ray term at 0.1
// to show the lighting alone; the shipped value is 0.5 (foglight_beams5.cfg).
// foglight_off.cfg is the older fog that shadow-tests the brightest light only.
rt_metal_lightsample 1
rt_metal_fog_beams 0.1
echo "foglight ON: every light shadowed in the fog, beams 0.1 (foglight_beams5.cfg is the shipped 0.5)"

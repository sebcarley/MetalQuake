// M5 flamethrower: the HYBRID stream (2026-10-05; the shipped look since 0.1.4,
// at Seb's own 0.22 / 0.22). A hose for the first stretch
// of its flight, fraying out and breaking into droplets of fire, each trailing
// its own little comet tail, for the rest of the way. Tune with
// m5_flamer_break (seconds of flight it stays a hose), m5_flamer_break_spread
// (how ragged the breakup is) and m5_flamer_drops (droplets a second).
// exec flamer_hoseonly.cfg puts the unbroken hose back.
m5_flamer_hose 1
m5_flamer_break 0.22
m5_flamer_break_spread 0.22
m5_flamer_drops 40
echo flamethrower: hose breaking into droplets (exec flamer_hoseonly.cfg for the unbroken hose)

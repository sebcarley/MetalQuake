// THE FOG FIZZ, REMEDY A (2026-09-28): the fog kernel's stochastic light pick OFF.
// Measured on Seb's demofizz (e1m2, wading the channel under the walkway, frames
// 3000-3007, the crosshair's fog crop): as played 1.65 levels of frame-to-frame
// grain, this 0.45 -- the whole of the fizz is the pick's variance, the FOGLIGHT
// residual. The trade: the fog goes back to the older estimator (the brightest
// light shadowed, the rest an unshadowed fill), so a torch's shadow in the fog is
// gone, and it is about a fifth faster. fizz_hybrid2.cfg and fizz_stride2.cfg
// keep the pick and take a quarter and a fifth of the grain off instead.
// exec fizz_back.cfg restores the played values.
rt_metal_lightsample 0
reellabel "^3fog light pick OFF" "no fizz, no torch shadows in the fog"
echo "fog light pick OFF (exec fizz_back.cfg to restore)"

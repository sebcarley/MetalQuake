// The froxel fog with a deeper history (0.95): calmer, with a touch more lag
// on a light that changes. froxel.cfg is 0.9, the default.
rt_metal_fog_froxel 1
rt_metal_fog_froxel_slices 48
rt_metal_fog_froxel_history 0.95
rt_metal_fog_froxel_curve 0
echo "froxel fog ON: history 0.95 (exec froxel.cfg for the default 0.9)"

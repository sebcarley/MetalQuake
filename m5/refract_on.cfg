// Refracting shockwaves (the default, 12): the explosion's and the ball's
// rings visibly bend the air behind them for the fifth of a second the wave
// takes to pass. cl_particles_refract is the strength in pixels; 8-16 is the
// sensible range. exec refract_off.cfg switches it off.
cl_particles_refract 12
echo "refracting shockwaves ON (the default) -- the explosion and ball rings bend the air (exec refract_off.cfg switches it off; cl_particles_refract is the strength in pixels)"

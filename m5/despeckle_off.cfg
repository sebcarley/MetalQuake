// The fog's despeckle stack as the quality tiers from Fast up ship it: blue
// noise on, the single-pass hybrid light pick, the 3x3 filter, no clamp. Blue
// noise is not a tier setting, so a tier click does not put it back; this file
// does. exec despeckle.cfg is the stronger arm.
rt_metal_bluenoise 1
rt_metal_lightsample_hybrid 3
rt_metal_fog_filter 1
rt_metal_fog_clamp 0
rt_metal_fog_reproject_depth 0
rt_metal_fog_tonemapema 0
echo "despeckle: the tiers' stack (blue noise, single-pass hybrid pick, the 3x3 filter, no clamp)"

// The fog's despeckle values as the quality tiers set them: blue noise on,
// the single 3x3 depth-aware filter (rt_metal_fog_filter 1), the single-pass
// hybrid pick form (rt_metal_lightsample_hybrid 3 -- inert while the pick is
// off, which it is on every tier since 2026-09-28), no clamp. Blue noise is
// not a tier setting, so a tier click does not put it back; this file does.
// exec despeckle.cfg is the stronger arm.
rt_metal_bluenoise 1
rt_metal_lightsample_hybrid 3
rt_metal_fog_filter 1
rt_metal_fog_clamp 0
rt_metal_fog_reproject_depth 0
rt_metal_fog_tonemapema 0
echo "despeckle: the tiers' values (blue noise, the single 3x3 filter, no clamp)"

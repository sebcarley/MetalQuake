// rt_metal_lightrank ON (the default): when more lights are in range than the
// ray tracer holds (256), keep the map lights whose reach looks largest from
// where the player stands. Compare with exec lightrank_off.cfg on Arcane
// Dimensions (Sepulcher, Zendar) or map e3m4.
rt_metal_lightrank 1
echo "lightrank ON (the default): the kernels carry the lights whose reach looks largest from here"

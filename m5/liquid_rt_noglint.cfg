// The liquid pair (see liquid_rt_on.cfg) with the reflection off: the water's
// own per-pixel light alone. exec liquid_rt_off.cfg reverts.
rt_metal_liquids_rt 1
rt_metal_liquids_reflect 0
reellabel "^3liquid pair, no reflection (reflect 0)" "the water's own light alone"
echo "liquid pair ON, own light only, no reflection (exec liquid_rt_off.cfg to revert)"

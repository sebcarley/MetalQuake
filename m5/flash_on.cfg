// The drawn muzzle flash (the default): the starburst at the muzzle and the
// hot-core sparks. m5_muzzleflash_size scales it. exec flash_off.cfg is the
// 1996 picture, the light alone.
m5_muzzleflash 1
echo "muzzle flash ON (the default) -- the starburst at the muzzle, the hot-core sparks (exec flash_off.cfg for the light alone; m5_muzzleflash_size scales it)"

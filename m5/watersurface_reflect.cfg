// THE ROOM IN THE WATER (VKRT 1b, 2026-09-27): a screen-space reflection on water
// and slime. The view ray is mirrored about the surface's own ripple and marched
// against the scene's depth, and where it lands the water takes the picture the
// screen has already drawn there -- a lamp with its glow, a torch, the bolt --
// mixed in at the surface's Fresnel share times r_watersurface_reflect. At 1 that
// share is physical: a few per cent looking thirty degrees down, a fifth at a
// grazing look; watersurface_reflect2.cfg and watersurface_reflect4.cfg brighten it two and
// four times for a mirror the eye can read from above; r_watersurface_reflect_ripple
// is how much the ripple bends the mirror (0 glassy, 1 a boil). It reflects what is on
// screen: the ceiling straight above you and a lamp behind you cannot appear
// (with the RT liquid pair on, watersurface_reflect_pair.cfg, the pair's flat
// reflection fills those in). Needs Force Water Alpha and Water Alpha below 1
// (the shipped profile has both) and the water surface on. No ray tracing is
// needed for this one, and it costs nothing where no water is in view.
// exec watersurface_on.cfg is the shipped look (reflection 4 since 2026-09-28).
r_watersurface 1
r_watersurface_reflect_ripple 0.35
r_watersurface_reflect 1
reellabel "^3reflection in the water (reflect 1)" "the picture on screen, mirrored by the surface"
echo "water surface reflection ON at 1 (exec watersurface_on.cfg to revert)"

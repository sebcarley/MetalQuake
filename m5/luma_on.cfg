// THE SLIPGATE GLOW (VKRT slice 2): a replacement texture pack's glow layer lifted
// to the 1996 texture's own fullbright peak at map load. QRP authored the slipgate's
// light strips at 72 of 255 where the original palette put them at 255 -- FTE without
// a pack shows the original. THE SHIPPED LOOK since 2026-09-28 (Seb's eye). Takes
// effect on the NEXT map load; exec luma_off.cfg for the pack's layers as authored.
m5_lumacalibrate 1
m5_lumacalibrate_max 4
reellabel "^3slipgate glow: 1996 peak" "replacement lumas lifted (next map load)"
echo "slipgate luma calibration ON -- takes effect on the next map load (exec luma_off.cfg reverts)"

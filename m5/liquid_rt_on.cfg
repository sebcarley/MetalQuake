// The liquid pair, THE FLAT MIRROR: blended water and slime take their own
// per-pixel light and a reflection from the ray tracer -- the pool floor stops
// printing through, and the torches and the room show in the water as a clean
// inverted image, faint straight down and strong across a lake. Needs Force
// Water Alpha, RT Liquid Lighting (rt_metal_liquids above 0) and wall lighting.
// Off in the engine's defaults; the downloadable profile and Seb's own config
// run the pair (reflection 4, rippled) UNDER the screen-space reflection
// (r_watersurface_reflect), where it fills only what the screen cannot see and
// is the whole of the mirror seen from below the surface. On its own it reads
// darker than the floor-lit look, because it bypasses the
// rt_metal_liquids_minlight floor, and it costs a few percent on a view that
// is mostly liquid. Kept for comparison with the
// RIPPLED reflection (liquid_rt_ripple.cfg, 2026-09-25), which is the one to
// judge; note that under the water surface (r_watersurface 1) this flat mirror
// is mixed in with the surface's texture and shows only at a grazing angle.
// rt_metal_liquids_reflect is the reflection's gain (liquid_rt_noglint.cfg
// removes it). exec liquid_rt_off.cfg reverts.
rt_metal_liquids_rt 1
rt_metal_liquids_reflect 1
rt_metal_liquids_ripple 0
reellabel "^3flat mirror (the pair as it shipped, ripple 0)" "the room in the water as a clean picture"
echo "liquid pair ON -- the water's own light and a FLAT reflection (exec liquid_rt_off.cfg to revert)"

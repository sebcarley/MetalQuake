// Light in the water (the default): the fog kernel's shafts and scatter
// survive under the surface, so the murk under water is lit where a light
// reaches it, on top of the water's own colour. The water's density and colour
// are unchanged. fog_liquidlight_half.cfg is half; fog_liquidlight_off.cfg
// none.
rt_metal_fog_liquidlight 1
echo "light in the water ON (the default) -- the fog kernel's shafts and scatter survive under water (exec fog_liquidlight_off.cfg switches it off)"

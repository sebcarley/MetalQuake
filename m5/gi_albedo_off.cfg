// The coloured bounce OFF: the bounce light takes a flat grey reflectance
// instead of each surface's own colour, so a red brick corridor no longer
// bleeds red into its corners. The default is on; rt_metal_gi_albedo_tex 1
// restores it.
rt_metal_gi_albedo_tex 0
echo GI COLOURED BOUNCE OFF (rt_metal_gi_albedo_tex 1 restores the default)

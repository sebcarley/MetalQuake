// DUST AS BONFIRE ASH, dimmed -- in one command.
//
// Three things together:
//   the PALETTE   m5_dust_tint 1 is the default: flecks of blue, grey and
//                 brown ash rather than a soot-to-white grey ramp. This line
//                 only matters if it has been turned off.
//   the ROOM      cl_particles_lighting_static 0.4 dims the light the motes
//                 take from the map's own torches and ceiling lights (the
//                 default is 1). A muzzle flash, a rocket's glow, an explosion
//                 and the handlamp are DYNAMIC and are not touched by it, so
//                 the dust sits dark in a torchlit corridor and still flares
//                 the instant something goes off.
//   the OPACITY   m5_dust_alpha 0.5 halves the motes' opacity (the default is
//                 1, the maximum): present without being specks of paint.
// dust_ash_dark.cfg is the rung below; dust_white.cfg is the old grey ramp.
// Back to the shipped defaults: cl_particles_lighting_static 1 and
// m5_dust_alpha 1.
m5_dust_tint 1
cl_particles_lighting_static 0.4
m5_dust_alpha 0.5
m5_reellabel_time 600
reellabel "DUST: BONFIRE ASH" "ash palette, room light at 0.4, alpha 0.5 -- flashes untouched"
echo "DUST ASH: tinted, room light dimmed, flashes kept. Defaults back: cl_particles_lighting_static 1, m5_dust_alpha 1. exec dust_white.cfg is the old ramp."

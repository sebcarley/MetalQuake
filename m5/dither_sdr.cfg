// r_dither ON, judged as an ordinary (non-HDR) screen shows it. On an HDR
// display the picture is never squeezed to 8 bits, so this turns HDR off to see
// the dither at all. Look at the darkest gradients: a pillar lit only by the
// room's fill, the shadow falling off a torch. They should fall away smoothly
// instead of in flat steps. Compare with exec dither_sdr_off.cfg. r_edr 1 turns
// HDR back on (the shipped profile's setting). r_dither is on by default, so this
// file's own change is the HDR switch-off; r_dither 0 is the undithered frame.
r_edr 0
r_dither 1
reellabel "^3r_dither 1 (HDR off)" "the darkest gradients dithered at the present"

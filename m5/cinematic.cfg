// CINEMATIC REPLAY -- the picture no quality tier can play in real time, for
// video capture. Nothing here is realtime-bound: a video capture paces the
// demo by the frame (a fixed 1/60 s a frame whatever the machine manages), so
// every history and every jitter runs by the frame counter and the result is
// repeatable. Use it as:
//   exec cinematic.cfg
//   playdemo demo1        (or any recorded demo: record <name> makes one)
//   cl_capturevideo 1
// in THAT order: starting a demo stops the one already playing -- the attract
// demo included -- and a stopping demo switches the capture off
// (cl_capturevideo_demo_stop). The capture stops when the demo ends and lands
// in <userdir>/m5/video/, as an uncompressed AVI unless the Ogg Theora library
// is installed (about 180 MB a second at 1080p60 -- keep it short, or set
// cl_capturevideo_width 1280). exec cinematic_off.cfg (or click a quality
// tier) BEFORE quitting, or these values are what the config saves.
vid_vsync 0
r_viewscale 1
r_metalfx 2
r_metalfx_reactive 3
rt_metal 1
rt_metal_scale 1
rt_metal_samples 32
rt_metal_lightsample 1
rt_metal_lightsample_hybrid 1
rt_metal_gi 1
rt_metal_gi_rate 1
rt_metal_fog 1
rt_metal_fog_scale 1
rt_metal_fog_froxel 1
rt_metal_fog_froxel_slices 64
rt_metal_fog_steps 64
rt_metal_fog_stride 1
rt_metal_fog_filter 1
r_volumetric_steps 64
r_volumetric_scale 1
cl_capturevideo_fps 60
cl_capturevideo_realtime 0
cl_capturevideo_ogg 1
cl_capturevideo_demo_stop 1
cl_capturevideo_width 0
cl_capturevideo_height 0
echo "CINEMATIC: native trace, 32 shadow rays, 64 fog slices, a cast every slice, the temporal upscaler at native resolution, 60 fps capture. Now: playdemo <name>; then cl_capturevideo 1 (that order). exec cinematic_off.cfg before quitting."

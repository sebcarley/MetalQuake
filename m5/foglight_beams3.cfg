// Every light shadowed in the fog (as foglight_on.cfg), with the god-ray term
// at 0.3 rather than the shipped 0.5: softer shafts, so the per-light shadow
// structure reads more than the beams. exec foglight_off.cfg restores the
// shipped fog (no per-light shadows, beams 0.5).
rt_metal_lightsample 1
rt_metal_fog_beams 0.3
echo "foglight ON, beams 0.3 (exec foglight_off.cfg restores the shipped fog)"

// The render-resolution FXAA pass back on. Every quality tier sets r_fxaa 0:
// r_smaa, the edge pass at native resolution, does that work now, and at the
// tiers' render scale FXAA only softens what the upscaler is about to work
// from. So a tier click turns it off again, and the M5 Quality row reads
// Custom while it is on. r_fxaa 0 reverts.
r_fxaa 1
echo "FXAA (render-resolution) ON -- a quality-tier click turns it off again; r_fxaa 0 reverts"

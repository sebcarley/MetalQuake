// The fog's stronger despeckle: the depth-aware filter run twice, the second
// pass spread wider (rt_metal_fog_filter 4), with the blue-noise sample
// table (the default). It also sets the two-ray alternating form of the fog
// light pick (rt_metal_lightsample_hybrid 2), which only matters once the
// pick is on (exec foglight_on.cfg) -- the pick is off on every tier since
// 2026-09-28, so as shipped this file is the wider filter alone. No deep 2D
// history and no clamp: measured against the true fog, a flat history trails
// the scene on a strafe. exec despeckle_off.cfg puts the tiers' values back,
// and so does clicking a tier.
rt_metal_bluenoise 1
rt_metal_lightsample_hybrid 2
rt_metal_fog_filter 4
rt_metal_fog_clamp 0
rt_metal_fog_reproject_depth 0
rt_metal_fog_tonemapema 0
echo "despeckle: ON (the fog filter twice, spread wider; the two-ray pick form if the pick is on -- exec despeckle_off.cfg restores the tiers' values)"

// The fog's stronger despeckle stack: the blue-noise sample table (the
// default), the fog light pick alternating between the brightest light and a
// pick over the rest at one ray a cast, and the 5x5 filter run twice with the
// second pass spread wider. No deep history and no clamp: measured against the
// true fog, a flat history trails the scene on a strafe. The quality tiers
// carry the single-pass pick and the single 3x3 filter; exec despeckle_off.cfg
// puts them back, and so does clicking a tier.
rt_metal_bluenoise 1
rt_metal_lightsample_hybrid 2
rt_metal_fog_filter 4
rt_metal_fog_clamp 0
rt_metal_fog_reproject_depth 0
rt_metal_fog_tonemapema 0
echo "despeckle: ON (blue noise, alternating dominant/pick casts, the filter twice; exec despeckle_off.cfg restores the tiers' stack)"

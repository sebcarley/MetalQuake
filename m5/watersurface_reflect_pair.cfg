// THE ROOM IN THE WATER, WITH THE RT PAIR BEHIND IT (VKRT 1b, 2026-09-27): the
// screen-space reflection at 2 (watersurface_reflect2.cfg), and where the screen
// has nothing to offer -- the ceiling straight above you, a lamp behind you --
// the RT liquid pair's own flat reflection, broken by the ripple, fills in
// (liquid_rt_ripple.cfg). The pair costs a few per cent on a view that is mostly
// liquid and reads the water a shade darker (it bypasses the minlight floor);
// watersurface_reflect2.cfg alone has neither. Needs wall lighting and RT Liquid
// Lighting for the pair. exec watersurface_on.cfg and liquid_rt_off.cfg revert.
r_watersurface 1
r_watersurface_reflect_ripple 0.35
r_watersurface_reflect 2
rt_metal_liquids_rt 1
rt_metal_liquids_reflect 1
rt_metal_liquids_ripple 1
reellabel "^3reflection in the water (reflect 2) + the RT pair" "the screen mirrored, the pair filling what it cannot see"
echo "water surface reflection ON at 2 with the RT liquid pair behind it (exec watersurface_on.cfg + liquid_rt_off.cfg to revert)"

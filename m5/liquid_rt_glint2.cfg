// The rippled reflection (see liquid_rt_ripple.cfg) with the reflection
// doubled. Since 2026-09-25 this recipe ripples the reflection as well; the
// flat mirror at any gain is liquid_rt_on.cfg plus rt_metal_liquids_reflect.
// exec liquid_rt_off.cfg reverts.
rt_metal_liquids_rt 1
rt_metal_liquids_reflect 2
rt_metal_liquids_ripple 1
r_watersurface 1
reellabel "^3rippled reflection, x2 (ripple 1, reflect 2)" "the room in the water, brightened twice"
echo "liquid pair ON, reflection rippled and doubled (exec liquid_rt_off.cfg to revert)"

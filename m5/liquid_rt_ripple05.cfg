// The rippled reflection (see liquid_rt_ripple.cfg) at HALF the ripple: the
// reflection read displaced by half of what the pool floor takes, so the mirror
// image wobbles rather than breaks. exec liquid_rt_off.cfg reverts.
rt_metal_liquids_rt 1
rt_metal_liquids_reflect 1
rt_metal_liquids_ripple 0.5
r_watersurface 1
reellabel "^3rippled reflection, half ripple (ripple 0.5, reflect 1)" "the mirror wobbling rather than breaking"
echo "liquid pair ON, reflection rippled at half strength (exec liquid_rt_off.cfg to revert)"

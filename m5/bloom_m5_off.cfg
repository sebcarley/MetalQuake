// The modern bloom OFF: r_bloom's original DarkPlaces blur and its six knobs
// (r_bloom_resolution, _blur, _brighten, _colorexponent, _colorscale,
// _colorsubtract) apply again. The shipped profile has the modern chain on;
// exec bloom_m5_on.cfg restores it.
r_bloom_m5 0
echo "modern bloom OFF -- the original blur and its six knobs again (exec bloom_m5_on.cfg restores the shipped chain)"

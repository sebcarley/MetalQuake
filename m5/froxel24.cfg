// The froxel fog at 24 slices -- cheaper, and it reads a touch brighter than
// the true fog because its cells are coarser. It is what the Better tier
// carries; froxel.cfg is the engine's own 48, and a tier click re-pins the
// tier's count.
rt_metal_fog_froxel 1
rt_metal_fog_froxel_slices 24
rt_metal_fog_froxel_history 0.9
rt_metal_fog_froxel_curve 0
echo "froxel fog ON: 24 slices (exec froxel.cfg for 48)"

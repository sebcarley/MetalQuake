// Scourge of Armagon -- per-pack look
//
// Auto-exec'd after your shared config whenever this pack is the primary
// gamedir. ONLY m5_* settings belong here: the config is shared across all the
// games now, so anything else written from a pack would follow you back into
// Quake the next time you quit. Every setting below is inert in stock Quake.
//
// Delete this file and the pack simply runs uncorrected.
//
// Why: Armagon's mappers used dimmer and tighter lights than id's -- mean
// colour 0.64 and mean radius 164 against e1m3's 0.71 and 207 -- and under RT
// wall lighting those entities ARE the scene's lighting. Uncorrected it
// rendered at 0.47 of stock Quake's frame brightness.

m5_packlight 1          // full auto-correction; lands it at 0.76 of stock
m5_packbrightness 1.08  // the rest of the way by eye

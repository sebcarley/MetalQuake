// Soft particles (the default, 24): smoke, fire and dust fade where they meet
// a wall or the floor instead of being cut by it. cl_particles_soft is the
// distance in world units; 16-32 is the sensible range. exec soft_off.cfg
// switches it off.
cl_particles_soft 24
echo "soft particles ON (the default) -- smoke, fire and dust fade where they meet a wall or the floor, over 24 units (exec soft_off.cfg switches it off; cl_particles_soft is the distance)"

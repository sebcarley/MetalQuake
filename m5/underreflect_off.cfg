// THE WATER SURFACE SEEN FROM BELOW (2026-09-29). Submerged, the screen-space
// reflection stands down and the underside's mirror is the ray-traced pair's plain
// image alone; this scales it while the eye is in a liquid. The ladder:
// underreflect_off.cfg (0) / underreflect_on.cfg (0.25, shipped) / underreflect_full.cfg (1).
// From above the waterline nothing changes.
rt_metal_liquids_reflect_under 0
reellabel "^3underside reflection 0" "no reflection from below"
echo "underside reflection scale 0 (exec underreflect_off.cfg / underreflect_on.cfg / underreflect_full.cfg)"

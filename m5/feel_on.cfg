// M5 weapon feel ON -- the shipped defaults: a per-weapon kick with the eye
// shoved back, hot nail tracers on every third nail, nails from the two barrel
// tips, axe sparks. The grenade bounce (re-struck at a random pitch, its
// volume following the impact) stays off, which is also its default;
// m5_grenadebounce 1 tries it. All five are rows on Options -> M5 Fun Mods.
// exec feel_off.cfg is the 1996 guns.
m5_kick 1
m5_grenadebounce 0
m5_nailtracer 1
m5_nailtracer_every 3
m5_nailbarrels 1
m5_axesparks 1
echo weapon feel ON (the shipped defaults) -- kick 1, stock grenade bounce, nail tracers every third nail, nails from the two barrels, axe sparks

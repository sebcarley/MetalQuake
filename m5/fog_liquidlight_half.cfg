// Light in the water at half strength: half of the fog kernel's shafts and
// scatter survive under the surface. 1 is the default (fog_liquidlight_on.cfg),
// 0 none of it (fog_liquidlight_off.cfg).
rt_metal_fog_liquidlight 0.5
echo "light in the water at half (exec fog_liquidlight_on.cfg restores the default)"

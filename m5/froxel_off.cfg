// The flat 2D fog history: the fog's history kept per screen texel rather than
// per depth cell -- the older method, and what the Good tier and the tiers
// below it run. Better and above run the froxel volume, the default; exec
// froxel.cfg (or a tier click at Better or above) puts it back.
rt_metal_fog_froxel 0
echo "froxel fog OFF -- the flat 2D history (exec froxel.cfg restores the volume)"

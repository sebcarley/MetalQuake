// THE SLIPGATE GLOW, HALF WAY (VKRT slice 2): the same lift capped at x2, so the
// slipgate's strips come up (x2 of QRP's 72) but the ceiling lamps, which want x4
// to reach the 1996 peak, stop at double. Next map load; exec luma_off.cfg reverts.
m5_lumacalibrate 1
m5_lumacalibrate_max 2
reellabel "^3slipgate glow: capped x2" "replacement lumas lifted to double at most"
echo "slipgate luma calibration ON at a x2 cap -- next map load (exec luma_off.cfg reverts)"

// Water takes its own light, not the pool floor's. rt_metal_liquids
// multiplies the ray-traced lighting into blended water, and because the ray
// passes through the surface that term is the lighting of whatever lies under
// it -- the submerged geometry's shadows print onto the water. This blends
// the term toward one light reading taken at the surface, per pool. Its limit:
// one reading per drawn batch, so a big pool can show its seams as large
// squares of different brightness. Kept for comparison, off by default; needs
// rt_metal_liquids above 0 and r_wateralpha_force 1. exec liquid_own_off.cfg
// reverts.
rt_metal_liquids_own 1
echo "liquid own-light ON -- one light reading per pool; a large pool may show square seams (exec liquid_own_off.cfg to revert)"

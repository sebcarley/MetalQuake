// One-bounce diffuse GI: torch light reaches shadowed corners and rooms read
// lit rather than painted. Needs rt_metal 1 and rt_metal_walllight above 0
// (the shipped profile has both). On by default and on the Best and Ultimate
// tiers; the tiers below drop it for frames. Judge it in motion: walk the e1m3
// start corridor and an e1m7 lava room, and watch for speckle or ghosting on
// turns. exec gi_off.cfg reverts.
rt_metal_gi 1
echo GI ON -- one-bounce (gi_off.cfg reverts)

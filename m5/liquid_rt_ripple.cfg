// THE RIPPLED REFLECTION (VKRT slice 1, 2026-09-25): the liquid pair's reflection
// of the room, broken up by the water surface's own ripple -- a torch on the
// bank reads as a wobbling smear on the water, not a picture. The reflection
// sits over the refracted view at its own Fresnel weight now (faint straight
// down, strong across a lake); the flat mirror had been mixed in with the
// surface's texture, and under the water surface that share is next to nothing
// except at a grazing angle. Needs Force Water Alpha, RT Liquid Lighting
// (rt_metal_liquids above 0), wall lighting and the water surface
// (r_watersurface 1, the shipped default -- the ripple is the surface's own).
//
// Two things you will see that are NOT the ripple: the water reads DARKER than
// the shipped look, because the pair bypasses the rt_metal_liquids_minlight
// floor (the room's real light at the surface -- rt_metal_liquids is the level);
// and it costs a few percent on a view that is mostly liquid, nothing where no
// liquid is in view. liquid_rt_ripple05.cfg halves the ripple,
// liquid_rt_glint2.cfg / liquid_rt_glint4.cfg brighten the reflection two and
// four times; liquid_rt_on.cfg is the flat mirror for comparison.
// exec liquid_rt_off.cfg reverts.
rt_metal_liquids_rt 1
rt_metal_liquids_reflect 1
rt_metal_liquids_ripple 1
r_watersurface 1
reellabel "^3rippled reflection (ripple 1, reflect 1)" "the room in the water, broken up by the surface"
echo "liquid pair ON, reflection rippled by the surface (exec liquid_rt_off.cfg to revert)"

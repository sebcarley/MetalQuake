// THE LAMPS AS LIGHTS (VKRT slice 3): the base set's ceiling lamps, wall lights, lit
// floor panels, base buttons and the slipgate's strips each feed a light at their own
// face into the ray tracer -- a hemisphere off the face, so a ceiling lamp lights the
// ceiling around it and the fog beneath it where the map's light entity only lights
// the floor. Live at once. The ladder: fixturelights_half.cfg / fixturelights.cfg /
// fixturelights2.cfg; fixturelights_off.cfg is the picture before. The shipped look is
// fixturelights_half.cfg (0.5) since 2026-09-29; this is full strength.
rt_metal_fixturelights 1
reellabel "^3lamp fixtures lit (1)" "the lamps light their own ceilings and the fog above them"
echo "fixture lights 1 (exec fixturelights_off.cfg / fixturelights_half.cfg / fixturelights.cfg / fixturelights2.cfg)"

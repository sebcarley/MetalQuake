// Acceleration-structure reuse (the default): on a frame where no monster,
// torch or model moved, the ray tracer keeps last frame's structure instead of
// rebuilding it. The picture is identical either way; it saves a little time
// on a fifth to a third of frames in ordinary play, and on every frame when
// standing still with no torch in view. exec asskip_off.cfg switches it off.
rt_metal_as_skipstatic 1
echo "acceleration-structure reuse ON (the default; exec asskip_off.cfg switches it off)"

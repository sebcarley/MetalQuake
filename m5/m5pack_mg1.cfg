// Dimension of the Machine -- per-pack look
// See m5pack_hipnotic.cfg for what may go in these files and why.
//
// This is the pack that read "sun-baked and glowing orange", and almost all of
// that was the _color unit bug (its lights are written 0-255 and were being
// read as 0-1, so they arrived ~126x too bright AND hue-biased). With that
// fixed it needs very little: 1.02 and 0.96 of stock Quake on the two maps
// measured. Its warmth is left alone on purpose -- that is what the mapper
// built, and it is now +8 rather than +79.
//
// Seven of its 25 maps also set their own fog, which the murk now takes the
// colour of instead of drawing a second fog on top (m5_packfog).

m5_packlight 1
m5_packbrightness 1

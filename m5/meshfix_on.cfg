// THE CHAINMAIL FIX (2026-09-29), the shipped look: the lights shadow-tested past the
// brightest rotate their rays each frame and are accumulated, instead of standing on
// a fixed woven dither that the upscaler magnified into a mesh on lit walls.
// exec meshfix_off.cfg is the kernel before. A one-off pause while the kernel rebuilds.
rt_metal_shadowlights_smooth 1
reellabel "^3shadow lights smoothed" "the mesh fix (shipped)"
echo "shadow lights SMOOTHED (exec meshfix_off.cfg for the fixed dither)"

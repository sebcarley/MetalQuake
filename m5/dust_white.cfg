// THE OLD WHITE DUST: the soot-to-white grey ramp in place of the ash
// palette, with the room's light at full strength (the shipped default) and
// full opacity (the shipped default is 0.5 since 2026-09-28). It is the look the ash palette
// replaced -- bright white motes that catch the eye in any lit corridor.
// m5_dust_tint 1 restores the palette; exec dust_ash.cfg is the dimmer ash
// rung.
m5_dust_tint 0
cl_particles_lighting_static 1
m5_dust_alpha 1
m5_reellabel_time 600
reellabel "DUST: WHITE" "soot-to-white ramp, room light full, alpha 1"
echo "DUST WHITE: the old grey ramp. m5_dust_tint 1 restores the ash palette; exec dust_ash.cfg dims it."

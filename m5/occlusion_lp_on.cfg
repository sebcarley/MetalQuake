// The occlusion low-pass (the default): a sound with a wall between it and the
// listener is dulled, not just quietened -- low-passed at snd_occlusion_cutoff
// (1200 Hz), so a Shambler behind a door reads as a muffled presence rather
// than a distant one. exec occlusion_lp_off.cfg switches it off.
snd_occlusion_lowpass 1
echo "occlusion low-pass ON (the default; exec occlusion_lp_off.cfg switches it off; snd_occlusion_cutoff 1200 is how muffled)"

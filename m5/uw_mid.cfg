// UNDERWATER visibility ladder. r_volumetric_waterdensity is the murk's
// density inside water; slime inherits it unless r_volumetric_slimedensity is
// set, and lava has its own (r_volumetric_lavadensity, 0.4). The murk
// half-obscures at roughly 70/value world units. The ladder is uw_clear 0.6 /
// uw_mid 1.0 (the shipped profile's value) / uw_thick 2.5; the engine's own
// default is 0.4, clearer still.
// This rung: the middle, and the shipped profile's value -- half-obscured at
// about 70 units, black by about 250.
r_volumetric_waterdensity 1.0
echo "underwater murk: waterdensity 1.0 (uw_mid, the shipped profile's value; the ladder is uw_clear 0.6 / uw_mid 1.0 / uw_thick 2.5)"

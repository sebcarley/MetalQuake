// GI ambient occlusion (the default): the ambient fill darkens in corners and
// under ledges, read off the bounce ray at no extra cost. It does something
// only where bounce lighting runs (the Best and Ultimate tiers). rt_metal_gi_ao
// is the fraction, _dist the range. gi_ao_half.cfg is half; gi_ao_off.cfg
// none.
rt_metal_gi_ao 1
echo "GI ambient occlusion ON (the default) -- the ambient fill darkens in corners and under ledges, from the bounce ray (exec gi_ao_off.cfg switches it off; rt_metal_gi_ao is the fraction, _dist the range)"

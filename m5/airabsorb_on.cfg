// Distance air absorption: a far sound loses its top end the way air takes it.
// Nothing within 300 units is touched; from there a sound dulls with distance
// until, 2000 units out, its cutoff is 2500 Hz (snd_airabsorb_start / _dist /
// _cutoff). Off by default. An outdoor map shows it best: e1m1's start with a
// fight in the distance, or the Arcane Dimensions hub.
snd_airabsorb 1
echo "air absorption ON (exec airabsorb_off.cfg to revert)"

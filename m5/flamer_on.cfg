// M5 flamethrower ON (FLAMETHROWER.md): owning the thunderbolt grants a napalm
// thrower beside it. Key 0 selects it (impulse 203; again for the bolt). It
// spends the bolt's cells, one a tick, arcs a white-yellow stream under gravity,
// sets what it touches alight and leaves fire on walls and floors -- which
// burns you too. m5_flamer 0 (or exec flamer_off.cfg) removes it.
m5_flamer 1
bind 0 "impulse 203"
echo flamethrower ON -- key 0 (exec flamer_off.cfg to remove it)

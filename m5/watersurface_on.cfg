// WATER SURFACE, the shipped look (the defaults): a rippling refraction over
// the drawn pool floor, with the in-water murk kept at full strength from the
// bank (deep pools hide their bottoms, shallow ones stay readable) and the
// shallow taper on. Needs Force Water Alpha on and Water Alpha below 1 (the
// shipped profile has both). exec this to get back to it; watersurface_fte.cfg
// is the FTEQW engine's style like for like (crystal-clear water, no taper),
// watersurface_big.cfg the exaggerated arm, watersurface_off.cfg the flat sheet;
// the room's reflection is on at 4 (watersurface_reflect_off.cfg takes it off).
r_watersurface 1
r_watersurface_distort 0.1
r_watersurface_speed 1
r_watersurface_warp 1
r_watersurface_bump 4
r_watersurface_guard 1
r_watersurface_opacity 0
r_watersurface_fresnel 5
r_watersurface_taper 48
r_watersurface_clear 1
r_watersurface_reflect 4
r_watersurface_reflect_ripple 0.35
r_watersurface_tint_red 0.7
r_watersurface_tint_green 0.8
r_watersurface_tint_blue 0.7
echo "water surface ON (the shipped look) -- exec watersurface_off.cfg for the flat sheet"

// THE ROUND SPOTLIGHTS, fixed (the default): shadow-test the three brightest
// lights at every pixel instead of one. With one, every light past the
// brightest rides in the sum with no occlusion test at all, so a light in the
// next room or in a ceiling recess paints its full disc straight through the
// wall -- a clean round pool of light in an odd place. rt_metal_shadowlights_rays
// (2) is how many rays each extra light spends; every tier that runs the ray
// tracer sets 3. spotfix_max.cfg is four lights at four rays; spotfix_off.cfg
// the dominant light alone.
rt_metal_shadowlights 3
rt_metal_shadowlights_rays 2
echo "spotfix: 3 lights shadow-tested per pixel (the default; spotfix_off.cfg is the dominant light alone)"

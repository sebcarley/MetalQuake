// The sky light ON at the map's own strength and angle: the ray tracer takes
// a sun from the map's _sunlight keys (Arcane Dimensions declares one on its
// start hub, the Sepulcher and its first level; stock Quake's maps do not --
// sun_e1m1.cfg sets one by hand), and every surface casts a ray toward it and
// is sunlit where that ray reaches open sky. Clears any hand-set sun first so
// the map's own keys decide. It shows only under Full Wall Lighting. Off by
// default; exec sun_off.cfg to revert; rt_metal_sun 2 doubles it.
rt_metal_sun_light 0
rt_metal_sun_color ""
rt_metal_sun_mangle ""
rt_metal_sun_penumbra -1
rt_metal_sun 1
echo "sky light ON at the map's own strength (exec sun_off.cfg to revert; rt_metal_sun 2 doubles it)"
